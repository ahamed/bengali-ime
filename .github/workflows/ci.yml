name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install
      - run: yarn test
      - name: Check parity fixtures are up to date
        run: |
          yarn fixtures
          if [ -n "$(git status --porcelain fixtures/)" ]; then
            echo "::error::fixtures/ is stale. Run 'yarn fixtures' and commit the result."
            git status --porcelain fixtures/
            git diff --stat fixtures/
            exit 1
          fi
      - run: yarn run build
      - run: yarn example:build
