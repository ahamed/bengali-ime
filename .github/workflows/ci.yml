name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: examples/playground/yarn.lock
      - run: cargo clippy -p druti-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build the playground (wasm-pack, type check, Vite)
        working-directory: examples/playground
        run: |
          yarn install --frozen-lockfile
          yarn build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Docs build without warnings (broken links, missing docs)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # The workspace's rust-version (Cargo.toml) must stay true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - name: Swift format and style
        # The newest Xcode on the image; its swift-format is closest to current local Xcodes.
        run: make -C macos lint
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install Rosetta if missing (for the x86_64 tests)
        run: arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
      - name: Swift tests (bindings and helpers)
        run: make -C macos test
      - name: Rust engine tests on x86_64 (Rosetta)
        run: cargo test --target x86_64-apple-darwin -p druti-core
      - name: Swift tests on x86_64 (Rosetta)
        # The whole toolchain runs as x86_64, so the test bundle loads.
        run: arch -x86_64 swift test --package-path macos/BengaliIMECore
      - name: Build and sign the input method
        run: make -C macos app
      - name: Check the bundle
        run: |
          APP=macos/build/DerivedData/Build/Products/Release/Druti.app
          for BIN in macos/BengaliIMECore/BengaliIMEFFI.xcframework/macos-arm64_x86_64/libbengali_ime_ffi.a "$APP/Contents/MacOS/Druti"; do
            ARCHS="$(lipo -archs "$BIN")"
            echo "$BIN: $ARCHS"
            for A in arm64 x86_64; do
              [[ " $ARCHS " == *" $A "* ]] || { echo "::error::$BIN is missing $A"; exit 1; }
            done
          done
          plutil -extract InputMethodServerControllerClass raw "$APP/Contents/Info.plist"
          plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/MenuIcon.tiff"
