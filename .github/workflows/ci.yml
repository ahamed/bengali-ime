name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install
      - run: yarn test
      - name: Check parity fixtures are up to date
        run: |
          yarn fixtures
          if [ -n "$(git status --porcelain fixtures/)" ]; then
            echo "::error::fixtures/ is stale. Run 'yarn fixtures' and commit the result."
            git status --porcelain fixtures/
            git diff --stat fixtures/
            exit 1
          fi
      - run: yarn run build
      - run: yarn example:build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - name: Swift tests (bindings and helpers)
        run: make -C macos test
      - name: Build and sign the input method
        run: make -C macos app
      - name: Check the bundle
        run: |
          APP=macos/build/DerivedData/Build/Products/Release/Seher.app
          lipo -info macos/BengaliIMECore/BengaliIMEFFI.xcframework/macos-arm64/libbengali_ime_ffi.a
          lipo -info "$APP/Contents/MacOS/Seher"
          plutil -extract InputMethodServerControllerClass raw "$APP/Contents/Info.plist"
          plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/MenuIcon.tiff"
