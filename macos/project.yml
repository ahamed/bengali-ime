# XcodeGen spec: `xcodegen generate` writes Druti.xcodeproj (not
# committed). Use the Makefile rather than building in Xcode directly.
name: Druti
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  BengaliIMECore:
    path: BengaliIMECore
targets:
  Druti:
    type: application
    platform: macOS
    sources:
      - path: Druti
    dependencies:
      - package: BengaliIMECore
      - sdk: InputMethodKit.framework
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_NAME: Druti
        PRODUCT_BUNDLE_IDENTIFIER: com.ahamed.inputmethod.Druti
        INFOPLIST_FILE: Druti/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Signed ad hoc by the Makefile after the build (no Apple account needed).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Druti:
    build:
      targets:
        Druti: all
