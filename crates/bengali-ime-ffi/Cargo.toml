[package]
name = "bengali-ime-ffi"
description = "UniFFI bindings (Swift) for bengali-ime-core, used by the macOS input method"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib for the XCFramework; cdylib so uniffi-bindgen can read the metadata in library mode.
crate-type = ["lib", "staticlib", "cdylib"]
name = "bengali_ime_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
bengali-ime-core = { version = "0.1.0", path = "../bengali-ime-core" }
uniffi = "=0.32.2"
