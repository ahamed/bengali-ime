schema: spec-driven

context: |
  Project: @ahamed/bengali-ime, a deterministic phonetic roman-to-Bengali transliteration
  engine (Avro-style typing, not translation). The TypeScript library in src/ is the
  reference implementation ("oracle"): BengaliIME holds state (output, buffer, flags),
  process()/processBackspace() return IMEAction[] (insert, replace(charsBack), delete(charsBack),
  splitBlock), and rules live in small Akkhar classes under src/supports/. Tests use vitest.

  Current direction (see docs/macos-input-source.md): Druti, a macOS input source distributed
  publicly as a DMG on GitHub Releases.
  - Rust core (Cargo workspace in this repo: crates/bengali-ime-core, crates/bengali-ime-ffi),
    ported from the TS engine and kept in parity via JSON fixtures generated by the TS engine.
  - UniFFI bindings packaged as an XCFramework (Universal arm64 + x86_64 macOS now, iOS keyboard
    extension later).
  - Swift + AppKit + InputMethodKit input method, Xcode project generated by XcodeGen,
    ad-hoc signed. The app installs itself into ~/Library/Input Methods when opened from the DMG;
    make install runs the same installer for developers.
  - Typing model: Bengali appears on every key; everything except the engine buffer is committed,
    the buffer is marked text with the underline hidden where possible.
  - Target: Universal (Apple Silicon + Intel), deployment target macOS 14. No paid Apple Developer
    account: no Developer ID, no notarization, no CI secrets.

  Constraints:
  - Do not change the TS engine's observable behaviour unless a change says so explicitly;
    Rust-only features (config toggles, grapheme backspace) must default to TS-identical behaviour.
  - Lengths crossing the FFI are UTF-16 code units, matching TS charsBack and NSRange.
  - Development happens partly in a Linux cloud session (Rust, TS, fixtures) and partly on the
    user's Mac (Xcode, InputMethodKit, manual app testing); tasks should say which.

rules:
  tasks:
    - Group tasks by milestone and mark each group as "Linux" or "Mac" depending on where it can be built and verified
    - Every task that changes engine behaviour must name the fixture or test that proves it
  design:
    - Call out any place where Rust behaviour intentionally differs from the TS engine
